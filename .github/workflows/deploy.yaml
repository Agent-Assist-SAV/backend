name: Deploy Application
run-name: ${{ github.actor }} is deploying 🚀
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: 'deliverybot/helm@v1.7.0'
        with:
            chart: 'helm'
            release: '${{ inputs.release_name }}'
            namespace: 'default'
            token: '${{ github.token }}'
            value-files: helm/values.yaml
            secrets: >-
              |
                OVH_API_KEY: ${{ secrets.OVH_API_KEY }}